<svg xmlns="http://www.w3.org/2000/svg" width="400" height="280" viewBox="0 0 400 280">
  <rect width="400" height="280" fill="#f8fafc" rx="8"/>
  <rect x="20" y="20" width="360" height="240" fill="white" stroke="#e2e8f0" stroke-width="1.5" rx="6"/>
  <!-- Header bar -->
  <rect x="20" y="20" width="360" height="48" fill="#0f172a" rx="6"/>
  <rect x="20" y="52" width="360" height="16" fill="#0f172a"/>
  <text x="200" y="50" font-family="sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">BANK PAYMENT RECEIPT</text>
  <!-- Receipt lines -->
  <text x="48" y="96" font-family="sans-serif" font-size="11" fill="#64748b">Reference Number</text>
  <text x="352" y="96" font-family="sans-serif" font-size="11" fill="#1e293b" text-anchor="end">BCB-REF-20240110-001</text>
  <line x1="40" y1="106" x2="360" y2="106" stroke="#e2e8f0" stroke-width="1"/>
  <text x="48" y="124" font-family="sans-serif" font-size="11" fill="#64748b">Date</text>
  <text x="352" y="124" font-family="sans-serif" font-size="11" fill="#1e293b" text-anchor="end">10 Jan 2024</text>
  <line x1="40" y1="134" x2="360" y2="134" stroke="#e2e8f0" stroke-width="1"/>
  <text x="48" y="152" font-family="sans-serif" font-size="11" fill="#64748b">Account Holder</text>
  <text x="352" y="152" font-family="sans-serif" font-size="11" fill="#1e293b" text-anchor="end">Kevin Mutabazi</text>
  <line x1="40" y1="162" x2="360" y2="162" stroke="#e2e8f0" stroke-width="1"/>
  <text x="48" y="180" font-family="sans-serif" font-size="11" fill="#64748b">Account Number</text>
  <text x="352" y="180" font-family="sans-serif" font-size="11" fill="#1e293b" text-anchor="end">BCB-00123456</text>
  <line x1="40" y1="190" x2="360" y2="190" stroke="#e2e8f0" stroke-width="1"/>
  <!-- Amount -->
  <rect x="40" y="200" width="320" height="40" fill="#f0fdf4" rx="4"/>
  <text x="48" y="225" font-family="sans-serif" font-size="13" font-weight="bold" fill="#166534">AMOUNT DEPOSITED</text>
  <text x="352" y="225" font-family="sans-serif" font-size="13" font-weight="bold" fill="#166534" text-anchor="end">5,000,000 BIF</text>
  <!-- Stamp area -->
  <circle cx="330" cy="116" r="28" fill="none" stroke="#ef4444" stroke-width="2" stroke-dasharray="4,2" opacity="0.6"/>
  <text x="330" y="111" font-family="sans-serif" font-size="7" font-weight="bold" fill="#ef4444" text-anchor="middle" opacity="0.7">PAID</text>
  <text x="330" y="121" font-family="sans-serif" font-size="6" fill="#ef4444" text-anchor="middle" opacity="0.7">OFFICIAL</text>
  <text x="330" y="131" font-family="sans-serif" font-size="6" fill="#ef4444" text-anchor="middle" opacity="0.7">STAMP</text>
