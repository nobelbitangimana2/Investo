services:
  - type: web
    name: investo-api
    runtime: node
    region: frankfurt
    plan: free          # upgrade to starter for always-on

    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && node dist/main

    healthCheckPath: /api/health

    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false          # set in Render dashboard
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRY
        value: 15m
      - key: JWT_REFRESH_EXPIRY
        value: 7d
      - key: IMAGEKIT_PUBLIC_KEY
        sync: false          # set in Render dashboard
      - key: IMAGEKIT_PRIVATE_KEY
        sync: false          # set in Render dashboard
      - key: IMAGEKIT_URL_ENDPOINT
        sync: false          # set in Render dashboard
      - key: PORT
        value: "3001"
      - key: FRONTEND_URL
        sync: false          # set to your Vercel frontend URL
